<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23시 하단오거리 동물병원</title>

<style>
body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f4f7f5;
  margin:0;
  color:#17342a;
}
.wrap{
  max-width:760px;
  margin:30px auto;
  padding:0 15px;
}
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
h1,h2{
  margin-top:0;
}
.muted{
  color:#718078;
  margin-top:6px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
label{
  display:block;
  font-size:14px;
}
input,textarea,select{
  box-sizing:border-box;
  width:100%;
  margin-top:5px;
  padding:10px;
  border:1px solid #ccd6d1;
  border-radius:8px;
  font-size:14px;
}
textarea{
  min-height:80px;
  resize:vertical;
}
.full{
  grid-column:1 / -1;
}
button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  background:#247a57;
  color:white;
  cursor:pointer;
  font-size:14px;
}
button.secondary{
  background:#68756f;
}
.result{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:#eef7f2;
}
.divider{
  border:0;
  border-top:1px solid #e1e8e4;
  margin:22px 0;
}
@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
  <h1>23시 하단오거리 동물병원</h1>
  <div class="muted">간단 접수 테스트 화면</div>
</div>

<!-- 신규 접수 -->
<div class="card">
  <h2>신규 접수</h2>

  <form id="form">
    <div class="grid">

      <label>보호자명
        <input name="guardianName" required>
      </label>

      <label>전화번호
        <input name="guardianPhone" required>
      </label>

      <label>동물명
        <input name="petName" required>
      </label>

      <label>동물종
        <input name="petType" placeholder="강아지 / 고양이 / 기타" required>
      </label>

      <label>품종
        <input name="breed" required>
      </label>

      <label>성별
        <input name="gender" placeholder="남 / 여" required>
      </label>

      <label>나이
        <input name="age" type="number" min="0" required>
      </label>

      <label>체중(kg)
        <input name="weightKg" type="number" step="0.01" required>
      </label>

      <label class="full">주소
        <input name="address">
      </label>

      <label class="full">내원 사유
        <textarea name="reason" required></textarea>
      </label>

      <label class="full">추가 메모
        <textarea name="memo"></textarea>
      </label>

    </div>

    <label style="display:block;margin-top:14px;">
      <input type="checkbox" name="privacyConsent" style="width:auto;">
      개인정보 수집 동의
    </label>

    <label style="display:block;margin-top:8px;">
      <input type="checkbox" name="safetyConsent" style="width:auto;">
      진료 안전사항 동의
    </label>

    <button type="submit" style="margin-top:12px;">접수하기</button>
  </form>

  <div id="result" class="result"></div>
</div>


<!-- 재진 접수 -->
<div class="card">
  <h2>재진 접수</h2>
  <div class="muted">기존 진료를 받은 환자의 재진 접수입니다.</div>

  <form id="revisitForm">
    <div class="grid">

      <label>보호자 전화번호
        <input name="guardianPhone" required>
      </label>

      <label>동물명
        <input name="petName" required>
      </label>

      <label class="full">진료내용
        <textarea name="reason" required placeholder="예: 피부 재진, 약 처방, 경과 확인"></textarea>
      </label>

      <label>내원 예정일
        <input name="plannedVisitDate" type="date">
      </label>

      <label>내원 시간대
        <select name="plannedVisitPeriod">
          <option value="">선택</option>
          <option value="오전">오전</option>
          <option value="오후">오후</option>
          <option value="저녁">저녁</option>
        </select>
      </label>

      <label class="full">추가 메모
        <textarea name="memo"></textarea>
      </label>

    </div>

    <button type="submit" style="margin-top:12px;">재진 접수하기</button>
  </form>

  <div id="revisitResult" class="result"></div>
</div>


<!-- 오늘 대기자 -->
<div class="card">
  <h2>오늘 대기자</h2>
  <button type="button" class="secondary" onclick="loadWaiting()">대기자 새로고침</button>
  <div id="waiting" style="margin-top:12px;"></div>
</div>

</div>


<script>
const f = document.querySelector("#form");
const r = document.querySelector("#result");

f.onsubmit = async e => {
  e.preventDefault();

  const x = Object.fromEntries(new FormData(f));
  x.age = Number(x.age);
  x.weightKg = Number(x.weightKg);
  x.privacyConsent = f.privacyConsent.checked;
  x.safetyConsent = f.safetyConsent.checked;

  try {
    const a = await fetch("/api/intakes", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(x)
    });

    const d = await a.json();

    if(!a.ok){
      r.textContent = d.error || "접수에 실패했습니다.";
      return;
    }

    r.textContent = `접수 완료 · 대기번호: ${d.queueNumber}`;
    f.reset();
    loadWaiting();

  } catch(e){
    r.textContent = "접수 중 오류가 발생했습니다.";
  }
};


const rf = document.querySelector("#revisitForm");
const rr = document.querySelector("#revisitResult");

rf.onsubmit = async e => {
  e.preventDefault();

  const x = Object.fromEntries(new FormData(rf));

  try {
    const a = await fetch("/api/revisit-intakes", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(x)
    });

    const d = await a.json();

    if(!a.ok){
      rr.textContent = d.error || "재진 접수에 실패했습니다.";
      return;
    }

    rr.textContent = "재진 접수가 완료되었습니다.";
    rf.reset();

  } catch(e){
    rr.textContent = "재진 접수 중 오류가 발생했습니다.";
  }
};


async function loadWaiting(){
  try{
    const a = await fetch("/api/waiting");
    const d = await a.json();

    document.querySelector("#waiting").innerHTML =
      d.map(x =>
        `<div style="padding:8px 0;border-bottom:1px solid #eee;">
          <b>${x.queue_number}번</b>
          ${x.pet_name} · ${x.guardian_name}
          <span style="color:#718078;"> · ${x.reason || ""}</span>
        </div>`
      ).join("");

  }catch(e){
    document.querySelector("#waiting").textContent =
      "대기자 정보를 불러오지 못했습니다.";
  }
}

loadWaiting();
</script>

</body>
</html>
